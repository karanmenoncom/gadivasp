[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gadivasp"
version = "0.1.0"
description = "Notebook-friendly VASP workflow for NCI Gadi: build, submit, monitor, analyse."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["ase>=3.22", "numpy", "scipy", "matplotlib", "pyyaml", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "nbstripout"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gadivasp = ["job_template.sh"]
